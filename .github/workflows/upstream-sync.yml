name: Sync upstream (preserve local workflows)

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream and preserve local workflows
        env:
          UPSTREAM_REPO: "ophub/amlogic-s9xxx-armbian"
          UPSTREAM_BRANCH: "main"
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote remove upstream >/dev/null 2>&1 || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --prune upstream "${UPSTREAM_BRANCH}"

          backup="$(mktemp -d)"
          trap 'rm -rf "${backup}"' EXIT

          # Keep this fork's workflow files as a local automation overlay.
          if [ -d .github/workflows ]; then
            mkdir -p "${backup}/.github"
            cp -a .github/workflows "${backup}/.github/"
          fi

          before="$(git rev-parse HEAD)"

          set +e
          git merge --no-ff --no-commit "upstream/${UPSTREAM_BRANCH}"
          merge_status=$?
          set -e

          if [ "${merge_status}" -ne 0 ]; then
            unresolved="$(git diff --name-only --diff-filter=U)"
            dtb_conflict="build-armbian/armbian-files/platform-files/allwinner/bootfs/dtb/allwinner/sun50i-h618-x98h-100mb.dtb"

            # This exact binary DTB was added independently on both sides from
            # the same base by upstream's own commits. Prefer upstream/main's
            # copy so the fork follows the canonical board-support file. Do not
            # auto-resolve any other non-workflow conflict.
            if printf '%s\n' "${unresolved}" | grep -Fxq "${dtb_conflict}"; then
              echo "ℹ️ Resolving known X98H DTB add/add conflict in favor of upstream/main:"
              echo "   ${dtb_conflict}"
              git checkout --theirs -- "${dtb_conflict}"
              git add -- "${dtb_conflict}"
            fi

            unresolved="$(git diff --name-only --diff-filter=U)"
            non_workflow_conflicts="$(printf '%s\n' "${unresolved}" | grep -v '^\.github/workflows/' || true)"

            if [ -n "${non_workflow_conflicts}" ]; then
              echo "❌ Upstream merge has unexpected non-workflow conflicts:"
              printf '%s\n' "${non_workflow_conflicts}"
              git merge --abort || true
              exit 1
            fi

            echo "ℹ️ Workflow conflicts (if any) will be resolved by restoring the local workflow overlay."
          fi

          # Restore the exact pre-sync workflow tree. This avoids requiring the
          # special Workflows permission when upstream changed .github/workflows.
          rm -rf .github/workflows
          if [ -d "${backup}/.github/workflows" ]; then
            mkdir -p .github
            cp -a "${backup}/.github/workflows" .github/
          fi

          git add -A .github/workflows

          # All workflow conflicts must now be resolved by restoring our overlay.
          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "${remaining}" ]; then
            echo "❌ Unresolved conflicts remain:"
            printf '%s\n' "${remaining}"
            git merge --abort || true
            exit 1
          fi

          if git diff --cached --quiet && [ "$(git rev-parse HEAD)" = "${before}" ]; then
            echo "✅ Already up to date."
            exit 0
          fi

          git commit --no-edit -m "Merge upstream ${UPSTREAM_REPO}:${UPSTREAM_BRANCH} (preserve local workflows)"
          git push origin "HEAD:${UPSTREAM_BRANCH}"

          echo "✅ Upstream synchronized; local .github/workflows overlay preserved."
